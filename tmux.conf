set -g mouse on

# Enable hyperlinks
set -as terminal-features ",*:hyperlinks"

# Status bar configuration
set -g status-left ""
set -g status-left-length 80
set -g status-right "#{session_path}"
set -g status-right-length 80
set -g status-justify left
set -g status-style fg=colour0,bg=colour8
set -g window-status-separator "   /   "
set -g window-status-format '#I:#W#F'
set -g window-status-current-style fg=colour7,bg=colour8,bold
set -g window-status-current-format '#I:#W#F'
# set -g window-status-current-format '(#I:#W)'

# Navigate windows with Alt+number
# Offset the values so that the first window (0) is available with the leftmost
# number of the keyboard
bind -n M-1 select-window -t 0
bind -n M-2 select-window -t 1
bind -n M-3 select-window -t 2
bind -n M-4 select-window -t 3
bind -n M-5 select-window -t 4
bind -n M-6 select-window -t 5
bind -n M-7 select-window -t 6
bind -n M-8 select-window -t 7
bind -n M-9 select-window -t 8

# Navigate previous/next windows with Alt+[ and Alt+]
bind -n M-[ select-window -t :-
bind -n M-] select-window -t :+
