- defaults:
    link:
      relink: true

- clean: ["~"]

- tap:
    - yoanbernabeu/tap

- brew:
    - asdf
    - autoenv
    - autojump
    - bat
    - btop
    - coreutils
    - csshx
    - dyff
    - fd
    - fswatch
    - fzf
    - gh
    - git-delta
    - gnuplot
    - grepai
    - helm
    - htop
    - jmeter
    - jq
    - k9s
    - kubectx
    - kubernetes-cli
    - lazygit
    - nvim
    - pandoc
    - parallel
    - pipx
    - ripgrep
    - the_silver_searcher
    - tmux
    - tree
    - tree-sitter
    - tree-sitter-cli
    - universal-ctags
    - wget

# MacOS specific packages
- ifmacos:
    - brew:
        - duti
        - macmon

    - cask:
        - font-fira-code
        - font-jetbrains-mono
        - font-symbols-only-nerd-font
        - gitx
        - kitty

- link:
    ~/.asdfrc:
      force: true
      path: asdfrc
    ~/.config/kitty:
      force: true
      path: kitty
    ~/.config/nvim:
      force: true
      path: nvim
    ~/.gitattributes:
      force: true
      path: gitattributes
    ~/.gitconfig:
      force: true
      path: gitconfig
    ~/.gitignore:
      force: true
      path: gitignore
    ~/.tmux.conf:
      force: true
      path: tmux.conf
    ~/.zshrc:
      force: true
      path: zshrc

- ifubuntu:
    - apt:
        - build-essential
        - libbz2-dev
        - libffi-dev
        - liblzma-dev
        - libncursesw5-dev
        - libreadline-dev
        - libsqlite3-dev
        - libssl-dev
        - libxml2-dev
        - libxmlsec1-dev
        - llvm
        - make
        - tk-dev
        - wget
        - xz-utils
        - zlib1g-dev
        - zsh

- asdf:
    - plugin: java
      url: https://github.com/halcyon/asdf-java.git
      versions:
        - openjdk-25
      default: openjdk-25
    - plugin: nodejs
      url: https://github.com/asdf-vm/asdf-nodejs.git
      versions:
        - latest
      default: latest
    - plugin: python
      url: https://github.com/tuvistavie/asdf-python.git
      versions:
        - latest
      default: latest
