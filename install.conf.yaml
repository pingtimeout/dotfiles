- defaults:
    link:
      relink: true

- clean: ['~']

- shell:
  - description: Installing submodules
    command: |-
      git submodule update --init --recursive
  - description: Linuxifying MacOS
    command: |-
      cd linuxify && ./linuxify install
    stdout: true
    stderr: true
    stdin: true
  - description: Installing oh-my-zsh
    command: |-
      if [ -d "$HOME/.oh-my-zsh/" ]
      then
        echo "Oh-my-zsh is already installed, nothing to do"
      else
        sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
      fi
    stdout: true
    stderr: true
    stdin: true

- brew:
    - asdf
    - autoenv
    - autojump
    - bat
    - coreutils
    - csshx
    - duti
    - dyff
    - fswatch
    - fzf
    - gh
    - git-delta
    - gnuplot
    - helm
    - htop
    - jmeter
    - jq
    - k9s
    - kubectx
    - kubernetes-cli
    - lazygit
    - macmon
    - nvim
    - parallel
    - ripgrep
    - the_silver_searcher
    - tree
    - tree-sitter
    - universal-ctags
    - wget

- cask:
    - font-fira-code
    - font-jetbrains-mono
    - gitx
    - kitty

- link:
    ~/.gitconfig: gitconfig
    ~/.gitattributes: gitattributes
    ~/.gitignore: gitignore

