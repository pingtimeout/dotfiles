---
- defaults:
    link:
      relink: true

- clean: ["~"]

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - command: |
        if [ -d "$HOME/.oh-my-zsh/" ]
        then
          echo "Oh-my-zsh is already installed, nothing to do"
        else
          sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
        fi
      description: Installing oh-my-zsh
      stdout: true
      stderr: true
      stdin: true

- brew:
    # Utilities
    - bat
    - caffeine
    - calibre
    - csshx
    - duti
    - fd
    - ffmpeg
    - firefox
    - fswatch
    - fzf
    - grc
    - htop
    - imagemagick
    - jq
    - jid
    - netcat
    - nvim
    - parallel
    - spotify
    - the_silver_searcher
    - tree
    - tree-sitter
    - universal-ctags
    - vimr
    - vlc
    - zsh

    # Communication
    - slack
    - zoom

    # Dev stuff
    - asdf
    - autoenv
    - autojump
    - awscli
    - azure-cli
    - colima
    - coreutils
    - diff-so-fancy
    - docker
    - docker-compose
    - gh
    - git
    - google-cloud-sdk
    - gnuplot
    - helm
    - k9s
    - kubectx
    - plantuml
    - wget

- shell:
    - command: (cd linuxify && ./linuxify install)
      description: Linuxifying MacOS
      stdout: true
      stderr: true
      stdin: true
    - [
        gem install asciidoctor asciidoctor-diagram --user,
        Installing Asciidoctor and asciidoctor-diagram,
      ]
    - [
        duti -s org.mozilla.firefox .adoc all,
        Associating Asciidoc files with firefox,
      ]

- cask:
    - firefox
    - font-fira-code
    - font-jetbrains-mono
    - gitx
    - google-chrome
    - kitty

- create:
    - ~/.config/

- link:
    ~/.asdfrc: asdfrc
    ~/.config/kitty: kitty
    ~/.config/nvim: nvim
    ~/.config/yamllint: yamllint
    ~/.gitconfig: gitconfig
    ~/.gitattributes: gitattributes
    ~/.gitignore: gitignore
    ~/.grc: grc-confs
    ~/.zshrc: zshrc

- shell:
    - [gem install asciidoctor-diagram --user, Installing Asciidoctor-diagram]
    - [gem install asciidoctor-reducer --user, Installing Asciidoctor-reducer]

- asdf:
    - plugin: python
      global: 3.12.2
      versions:
        - 3.12.2

- asdf:
    - plugin: github-cli
      global: latest
      versions:
        - latest
    - plugin: java
      global: openjdk-25
      versions:
        - openjdk-21
        - openjdk-25
    - plugin: jmeter
      global: latest
      versions:
        - latest
    - plugin: kubectl
      global: latest
      versions:
        - latest
    - plugin: kubectx
      global: latest
      versions:
        - latest
    - plugin: lazygit
      global: latest
      versions:
        - latest
    - plugin: maven
      global: latest
      versions:
        - latest
    - plugin: mvnd
      global: latest
      versions:
        - latest
    - plugin: nodejs
      global: latest
      versions:
        - latest

- shell:
    - stdout: true
      quiet: true
      command: |
        echo "The environment is almost ready.  Now this following components should be installed manually:"
        echo "* JDK Mission Control"
